name: Build installers

# Build the desktop app for macOS, Windows and Linux on their native runners
# (PyInstaller cannot cross-compile). Run manually, or on a version tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: "dist/*.dmg"
            name: macos
          - os: windows-latest
            artifact: "dist/*.zip"
            name: windows
          - os: ubuntu-latest
            artifact: "dist/*.tar.gz"
            name: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The setup-python interpreter bundles tkinter on all three OSes, so the
      # build just needs PyInstaller + Pillow (build.py also installs these).
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Build installer
        run: python packaging/build.py

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: video-tools-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # On a version tag (e.g. v1.0.0), gather the three installers and publish a
  # GitHub Release with them attached — giving stable, versioned download links.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*/*
